<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBlog - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <div class="navbar">

            <div class="logo">
                MyBlog
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-blog.html">Create Blog</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>

        </div>
    </header>


    <!-- Dashboard -->
    <section class="dashboard">

        <h1>Welcome to Your Dashboard</h1>

        <p class="dashboard-text">
            Manage your blogs and create new posts.
        </p>

        <a href="create-blog.html" class="btn">
            + Create New Blog
        </a>

        <h2>My Blogs</h2>

        <!-- Search and Category Filter -->
        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search blogs by title or content..."
            >

            <select id="categoryFilter">

                <option value="all">All Categories</option>
                <option value="Technology">Technology</option>
                <option value="Education">Education</option>
                <option value="Travel">Travel</option>
                <option value="Other">Other</option>

            </select>

        </div>

        <!-- Blog Container -->
        <div class="blog-container" id="blogContainer">

            <p>Loading blogs...</p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>


    <script src="js/script.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
