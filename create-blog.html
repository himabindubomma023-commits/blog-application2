<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBlog - Create Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <div class="navbar">

            <div class="logo">
                MyBlog
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-blog.html">Create Blog</a>
            </nav>

        </div>
    </header>


    <!-- Create Blog -->
    <div class="form-container blog-form">

        <form id="blogForm">

            <h2>Create New Blog</h2>


            <label>Blog Title</label>

            <input
                type="text"
                id="blogTitle"
                placeholder="Enter blog title"
                required
            >


            <label>Category</label>

            <select id="blogCategory" required>

                <option value="">
                    Select Category
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Lifestyle">
                    Lifestyle
                </option>

            </select>


            <label>Blog Content</label>

            <textarea
                id="blogContent"
                rows="10"
                placeholder="Write your blog here..."
                required
            ></textarea>


            <label>Blog Image</label>

            <input
                type="file"
                id="blogImage"
                accept="image/*"
            >


            <button type="submit" class="btn">
                Publish Blog
            </button>

        </form>

    </div>


    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
